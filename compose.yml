services:
  db:
    image: postgis/postgis:16-3.4
    container_name: metsateatis-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT_HOST:-55432}:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - metsateatis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metsaregister} -d ${POSTGRES_DB:-metsaregister}"]
      interval: 10s
      retries: 5
      start_period: 5s
 
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: metsateatis-pipeline
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      WFS_BASE_URL: ${WFS_BASE_URL}
      MAA_WFS_BASE_URL: ${MAA_WFS_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    tty: true
 
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: metsateatis-scheduler
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      WFS_BASE_URL: ${WFS_BASE_URL}
      MAA_WFS_BASE_URL: ${MAA_WFS_BASE_URL}
      PIPELINE_CRON: "${PIPELINE_CRON:-0 6 * * *}"
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    command: ["bash", "scripts/start_cron.sh"]
 
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: metsateatis-dashboard
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dashboard:/app/dashboard
    working_dir: /app
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]
    ports:
      - "${DASHBOARD_PORT_HOST:-8501}:8501"
 
  superset-db:
    image: postgres:16
    container_name: metsateatis-superset-db
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: ${SUPERSET_DB_NAME}
    volumes:
      - superset-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER} -d ${SUPERSET_DB_NAME}"]
      interval: 5s
      retries: 10
    restart: always
 
  superset-init:
    image: apache/superset:latest
    container_name: metsateatis-superset-init
    depends_on:
      superset-db:
        condition: service_healthy
    volumes:
      - superset-home:/app/superset_home
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@superset-db:5432/${SUPERSET_DB_NAME}"
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username ${SUPERSET_ADMIN_USER} --firstname Admin --lastname User --email ${SUPERSET_ADMIN_EMAIL} --password ${SUPERSET_ADMIN_PASSWORD} &&
        superset init
    restart: "no"
 
 superset:
    image: apache/superset:latest
    container_name: metsateatis-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@superset-db:5432/${SUPERSET_DB_NAME}"
    ports:
      - "${SUPERSET_PORT_HOST:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    command: >
      bash -c "pip install psycopg2-binary && gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 'superset.app:create_app()'"
    restart: always
 
volumes:
  metsateatis_pgdata:
    name: metsateatis-pgdata
  superset-db-volume:
  superset-home:
